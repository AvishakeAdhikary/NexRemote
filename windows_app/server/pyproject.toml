[project]
name = "nexremote-server"
version = "1.1.0"
description = "NexRemote Windows host: protocol server, discovery, and local control API."
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
    "cryptography>=43",
    "sqlmodel>=0.0.22",
    "pydantic>=2.9",
    "psutil>=6.1",
    "mss>=9.0",
    "simplejpeg>=1.7",
    "numpy>=2.1",
    "pillow>=11.0",
    "pywin32>=308; sys_platform == 'win32'",
    "comtypes>=1.4; sys_platform == 'win32'",
    "pycaw>=20240210; sys_platform == 'win32'",
    "pyaudiowpatch>=0.2.12; sys_platform == 'win32'",
    "opencv-python-headless>=4.10",
    "vgamepad>=0.1.0; sys_platform == 'win32'",
    "winrt-runtime>=2.3; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2.3; sys_platform == 'win32'",
    "winrt-Windows.Media.Control>=2.3; sys_platform == 'win32'",
    "winrt-windows-devices-enumeration>=2.3 ; sys_platform == 'win32'",
    "winrt-windows-applicationmodel>=2.3 ; sys_platform == 'win32'",
]

[project.scripts]
nexremote-server = "nexremote_server.main:cli"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "pyinstaller>=6.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexremote_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "ASYNC109", "ASYNC110"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Body", "fastapi.Depends"]

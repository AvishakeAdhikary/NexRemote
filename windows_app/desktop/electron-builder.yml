# MSIX (appx) packaging for the Microsoft Store. Identity and publisher must never change:
# they make 1.1.x an update of the Store listing that WinUI 1.0.0.0 shipped under.
appId: NeuralNexusStudios.NexRemote
productName: NexRemote
copyright: Copyright © 2026 Neural Nexus Studios
directories:
  output: release
  buildResources: build
files:
  - dist-electron/**
  - out/**
  - package.json
  - "!**/*.map"
extraResources:
  - from: ../server/dist/nexremote-server
    to: server
  - from: build/logo.ico
    to: icon.ico
asar: true
win:
  icon: build/logo.ico
  target:
    - target: appx
      arch: [x64]
appx:
  applicationId: App
  identityName: NeuralNexusStudios.NexRemote
  publisher: CN=8559855F-6955-4418-A6D8-835C3238CF34
  publisherDisplayName: Neural Nexus Studios
  displayName: NexRemote
  backgroundColor: transparent
  languages: [en-US]
  minVersion: 10.0.17763.0
  maxVersionTested: 10.0.26226.0
  customManifestPath: build/appx-manifest.xml
  artifactName: NexRemote_${version}_${arch}.${ext}

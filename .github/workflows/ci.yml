name: NexRemote CI/CD

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CI: true
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default list includes "tools", which no longer exists in the SDK repository.
          packages: platform-tools

      - name: Install Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;36.1.0"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x client/NexRemote/gradlew

      # Pull requests from forks get no secrets, so only they may build unsigned.
      - name: Build Android package
        shell: pwsh
        run: .\scripts\build.ps1 -Configuration Release -SkipWindows ${{ github.event_name != 'pull_request' && '-RequireSigning' || '' }}

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            dist/android/NexRemote-android-release.apk
            dist/android/mapping.txt
          if-no-files-found: error
          retention-days: 14

  release-edge:
    name: Release Edge
    runs-on: ubuntu-latest
    needs: [android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    concurrency:
      group: nexremote-edge-release
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: android
          merge-multiple: true

      - name: Publish edge prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: edge
          target_commitish: ${{ github.sha }}
          name: NexRemote Edge
          prerelease: true
          make_latest: false
          generate_release_notes: true
          overwrite_files: true
          files: release/NexRemote-android-release.apk

  release-versioned:
    name: Release Versioned
    runs-on: ubuntu-latest
    needs: [android]
    if: startsWith(github.ref, 'refs/tags/v')
    concurrency:
      group: nexremote-versioned-${{ github.ref_name }}
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: android
          merge-multiple: true

      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NexRemote ${{ github.ref_name }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          overwrite_files: true
          body: |
            **Android:** download `NexRemote-android-release.apk` below and open it on your phone (Android 8.0 or later). If you installed NexRemote from Google Play, uninstall that copy first, because the two builds are signed differently.

            **Windows:** get NexRemote from the [Microsoft Store](https://apps.microsoft.com/detail/9P4RN2KGGJXC).
          files: release/NexRemote-android-release.apk
